spring.application.name=piano-tiles-ai

# Porta: 8080 no seu PC; na hospedagem (Render) ela vem da variável PORT
server.port=${PORT:8080}

# ===== Chave da GenAI =====
# NUNCA coloque a chave aqui (este arquivo vai para o GitHub).
# Use UMA das opções:
#   1) variável de ambiente OPENROUTER_API_KEY
#   2) arquivo chave.properties na raiz do projeto (já está no .gitignore) - veja chave.properties.exemplo
spring.config.import=optional:file:./chave.properties
spring.ai.openai.api-key=${OPENROUTER_API_KEY:SUA_CHAVE_AQUI}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=openrouter/free

# ===== Thymeleaf =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== Banco de dados H2 (em arquivo, os dados ficam salvos em ./data) =====
spring.datasource.url=jdbc:h2:file:./data/pianotiles
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Console do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/pianotiles)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
